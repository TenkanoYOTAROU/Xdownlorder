<!-- ===================== GSI DEM Downloader v13-16 =====================
v13-16 (2026-10-12): 実機で残った小さな濃紺の隙間を詰める。(1)3〜4方向の隅の上限を各2段→各3段に拡大(draft 系統あたり288→429、合計858。3段超が混ざる隅だけ従来どおり大きい2方向を残す)。(2)平らなタイルと斜面タイルの境(ログのflat-vs-slope gap)に壁を追加で置く(JUNC=true。平らな低いタイルから見て、平均高さが0.5以上高い斜面の隣へ、落差=四捨五入(1〜3段)の壁。斜面側の辺は両端で高さが違うため、壁がはみ出す可能性がある。気に入らなければ固定側LuaのJUNC=falseで無効)。ログ"junction walls"。(3)診断:斜面との境の例14件を、両タイルの4隅の高さ(Tile.getCornerTerrainHeight)付きでログに出す(slopeGap)。(4)Luaの開始ログv13-16。崖の判定・高さの書込・本処理の壁置きは変更なし。
v13-15 (2026-10-11): v13-15 (2026-10-11): (1)壁の絵の下端の余白WALL_PAD=0(実機で、壁の根元の濃紺の帯=絵が約8px上にずれていた原因を解消。ユーザーが先に手で修正済みの内容を正式に採用)。(2)3〜4方向に高い辺がある隅(従来は大きい2方向だけを残して1辺が欠け、濃紺の平行四辺形が出ていた)用に、各方向の落差が2段以下のときは削らず全方向の壁を置く。壁draftに3〜4方向(各1〜2段)の組合せを追加(各系統48個、合計draft数288/系統→576)。壁の絵は変更なし(frameが回転ごとに隣り合う2方向を選ぶため)。(3)Luaの開始ログをv13-15に。崖の判定・高さの書込・壁置きの本処理はv13-14のまま。
v13-14 (2026-10-10): v13-14 (2026-10-10): 実機テストの結論を反映。(1)案A:書込ありモードで、壁を置く本処理のあとに「陸の平らなタイルで、隣の平らなタイルより1段以上低い方向」へ壁を追加で置く(紫の隙間=壁の無い1段差を壁で覆う。1マス2方向まで、3方向以上は高い順に2つ)。ログ"extra walls (plan A)"。(2)壁draftすべてに"supports terrain":true と "supports slope":true を付与(斜面にも置ける。「壁だけ」モードでも壁が置けるようになった)。(3)データ側のLuaをcliff_data.luaに改名(固定側cliff.luaと同名にしない)。(4)Luaの開始ログをv13-14に。崖の判定・高さの書込・本処理の壁置きはv13-13のまま。
v13-13 (2026-10-09): v13-13 (2026-10-09): 紫の縞(壁が無い段差)の原因調査用に、固定側Luaの最終監査へログを追加しただけ(処理は変更なし)。追加ログ:(1)壁が無い段差(noWall)の落差ごとの個数、(2)その段差の両側のマスをこのプラグインが書いたか(0/1/2枚)と、低い側が海面(高さ0.5未満)の個数、(3)noWall例30件(座標・高さ・落差・書込有無)、(4)64x64の文字マップ(. 水 , 陸 W 壁 n 壁なし段差の低い側)。
v13-12 (2026-10-09): v13-12 (2026-10-09): 崖プラグインを「固定側(cliffwall_core)」と「データ側(cliffdata_幅x高_6桁)」に分離。実機テストで、別プラグイン同士がCity.getStorage()(街ごとの保存領域)を共有でき、保存後も残り、別の街には混ざらないことを確認したため。(1)ZIPに2つのフォルダが入る。固定側=壁の絵・walls.json・Lua本体(地図に依存しない。1回入れたら入れ替え不要。IDは$cliffwall_gen系で固定)。データ側=ROWS/EDGES/N/書込有無だけを持ち、街のseedが.pngで終わる(ハイトマップから作った街)ときだけcliffwall_dataとして街のstorageに書く。(2)固定側はデータが入るまで静かに待つ。(3)「壁だけ」チェックはデータ側のwriteに入るだけで、IDもフォルダ名も変わらない。(4)データ側は地図ごとに別ID(高さ配列のハッシュ6桁)。同時に使えるデータ側は1つだけ(使わない地図のデータ側はプラグイン画面で未使用にする)。崖の判定・書込・壁置きの処理はv13-11のまま。
v13-11 (2026-10-08): 崖プラグイン。v13-10の実機診断(書込のたびにゲームが島全体の斜面を整数の平らなマスに作り変える)を受けた変更。(1)プラグインの「実行済み」を、起動ごとではなく街ごと(City.getStorage()のテーブルで判別)にして、同じ起動中に新しい街を作っても動くようにした。(2)「崖: 高さを書かず壁だけ置く(実験)」チェックを追加。ONにすると高さを一切書かず、崖の辺の低い側のマスにだけ壁を置く(別ID $cliffwall_wo・フォルダ名に _wallsonly)。(3)最終監査で、水マスから陸への段差(普通の海岸線)を壁がない隙間として数えないよう分離。(4)壁を置いた後の広がり診断(spread after walls)を追加。
v13-10 (2026-10-07): 崖プラグインに診断だけを追加(崖の判定・書込・壁置きの動作はv13-9のまま)。(1)書込の前後で全マスの高さを比べ、書いたマスからの距離別に変わったマス数を出す(海岸/内陸別、水マスも)=ゲームの作り変えの広がり。(2)buildBuildingの戻り値(true/false/なし/エラー)を別々に数え、falseの例はisBuildingBuildableも記録。(3)壁を置いたあとにTile.isBuilding/getBuildingDraftで読み戻し。(4)最終地形で「平らどうしで1段以上違う隣」を全部数え、壁の有無・原因別(noWall/dirDropped/planZero/buildFailed/dropMismatch)に集計、平ら対斜面の0.5以上のズレも数える。
v13-9 (2026-10-07): 崖プラグインの設定だけ変更。v13-8の実機比較で、プラグインを入れたほうが入れない読込直後より見た目が悪かった(段々と紫の細い隙間)ため、崖の対象を大きな段差だけに絞る。CLIFF_MIN_GAME 3→5(ゲーム側の落差5段以上の辺だけ)、CLIFF_ROUNDS 2→1。ロジックはv13-8のまま。うまく見えたら4へ広げる。
v13-8 (2026-10-07): 崖プラグイン。v13-7の実機ログ(平らにしたマスが隣の斜面マスより高い境目 slopeLower=218 が紫の細い隙間の原因候補)への対策。(1)平らにしたマスの隣の斜面マスで、高さのズレが0.25(CLIFF_SLIVER)以上のものも、そのマスの丸めた高さで平らに書く(最大CLIFF_ROUNDS=2周)。判定は書込後にゲームから読み直した高さで行うので、ゲームが隣を自動で整えるならそれ以上は書かない。(2)City.getStorage()に「適用済み」の目印(cliffwall_done)を保存し、保存して開き直したときの再適用をなくす。(3)診断:書込後に隣の斜面マスの高さが変わったか(neighbor adaptation)、残った隙間の数(live)。
v13-7 (2026-10-07): 崖プラグイン。v13-6の実機ログ(崖の辺262のうちゲーム側の落差0段が95本・1段が43本・3段以上は48本)を受けて、崖の判定をゲーム側の落差で行う。定数CLIFF_MIN_GAME(初期値3)未満の辺は何もせずゲームの斜面のまま。診断に「平らにしたマスと隣の斜面マスの小数の食い違い(紫の細い隙間の候補)」の数を追加。
v13-6 (2026-10-07): 崖プラグイン。v13-5の実機ログ(壁を置けない段差162、役割の衝突107)への対策。(1)壁を置けない「平らにした側→未処理の斜面」の段差は、下側の斜面マスをそのゲーム高さ(丸め)で平らに書いて壁を置けるようにする(最大2周)。(2)崖の両側を平らにする歩きは、反対の役割のマスに当たったらそこで止める。(3)平らにしたマスの隣の水マスにも壁を置く。(4)診断:崖の辺のゲーム側落差の分布、追加で平らにしたマス数。※1回適用したらプラグインは外す(保存して開き直すと再適用され、壁のあるマスは高さが書き換わらない)。
v13-5 (2026-10-07): 崖プラグインの方式を変更。高さ表は「崖の位置と高い側」を決めるためだけに使い、高さはゲーム側の実際の地形(Tile.getTerrainHeight)を読んで使う。崖の両側を崖から離れる向きにCLIFF_WALKマス分、ゲーム側の上段/下段の高さへ平らにし、その間に壁を置く(落差はゲーム側の差、最大WALL_MAX_DROP)。壁の種類は(西北東南の落差)の全組合せ(辺は最大2つ)を用意しLuaが名前で選ぶ。表との食い違いで出ていた紫の穴・浮く緑マスの対策。診断ログ:表の高さ別のゲーム側平均、崖の本数と崖マスの割合、書込の読戻し、壁の数、壁を置けない段差の数。
v13-4 (2026-10-07): 崖プラグインのLuaの診断を修正。高さ取得は City/Builder ではなく Tile モジュール(Tile.getTerrainHeight / Tile.isLand、公式doc確認)。書き込み前のゲーム側の高さと表の高さの尺度比・水陸の食い違い・書き込み後の一致をログに出す。壁の置き方は v13-3 から変更なし。
v13-3 (2026-10-07): 崖プラグインのLuaで高さが1マスも書かれていなかった問題(実機ログ heights set: 0)の修正。高さ表を行配列+string.byteで読む方式に変更、書いた数が0なら壁を置かない、読み戻し診断ログを追加。
v13-2 (2026-10-07): 崖プラグインの出力を「崖のまわり(CLIFF_ZONE_R マス)だけ高さを書く」方式に変更(それ以外は読込時のなめらかな斜面のまま)。書き換え範囲内の段差は落差1から壁を置く。frames のキーを "bitmap"→"bmp" に修正(実機で bitmap は動かなかった)。
v13-1 (2026-10-06): 「崖プラグインで保存」ボタンを追加。高さ表(0=水,1〜15=陸)・崖の壁(隣との差3段以上)・壁の絵(落差1〜6)・Luaをまとめたプラグインフォルダ入りZIPを出力。PNG/ZIP出力は変更なし。
v13-0 (2026-10-05): 機能変更なしの整理版。変更履歴の全文は XDownlorder_CHANGELOG.md に移動した。
【主な仕様(要点)】
- 出力: DEM(標高)をグレーPNGにして保存。TheoTownの1タイル=10m固定。出力サイズ候補は32/64/128/256/384/512(+1024は繰上げ専用)。
- 標高→グレー: 陸は THEO_LAND_MIN_GRAY(11)〜THEO_MAX_GRAY(96)。グレー0〜10は水の帯(NoDataは0・alpha=0)。
- 面平均化 K=2(出力セルをK×Kの点で評価、有効率50%未満はNoData)。サブサンプル間の標高差が CLIFF_THRESHOLD_M(3m)以上なら平均せず高い側を採用(崖・護岸)。
- 水路補完 WATER_GAP_CLOSE: 部分的にNoDataの陸セルが、反対側の隣接2セルとも水なら水にする。
- 地図UI: 基点/終点は長押し(LOCK_LONGPRESS_MS=1000)、距離固定は🔓/🔒ボタン、拡大鏡あり。
【予定】崖プラグイン出力(崖の基準=隣り合うマスの高さの差が3段以上)。
====================================================== -->

<style>

  --bg:#111; --panel:#181818; --line:#333; --text:#eee; --sub:#999;

body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{padding:10px 14px;border-bottom:1px solid var(--line)}

  user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
}

}

  position:relative;width:100%;height:100%;overflow:hidden;
}

<script fetchpriority="high" src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";

/* ===================== 定数・データソース ===================== */
// 解像度(z値)が高い順=優先したいデータソース順
const SOURCES_ALL = [
  {name:"DEM1A", path:"dem1a_png", z:17, nominal:1, timeoutMs:75000},
  {name:"DEM5A", path:"dem5a_png", z:15, nominal:5, timeoutMs:30000},
  {name:"DEM5B", path:"dem5b_png", z:15, nominal:5, timeoutMs:30000},
  {name:"DEM5C", path:"dem5c_png", z:15, nominal:5, timeoutMs:30000},
  {name:"DEM10B", path:"dem_png", z:14, nominal:10, timeoutMs:30000}
];
const NODATA = 8388608;

// DEM優先モード:「1A優先」=DEM1Aから試す(従来どおり) /「5Aから選択」=DEM1Aを使わず5A/B/C→10Bのみ(既定・推奨)。
// DEM1Aは整備済みエリアが限定的なため、既定は5Aからの選択にしている。
const DEM_MODE_KEY="xdler_dem_mode";
let demMode="5a";
try{ if(localStorage.getItem(DEM_MODE_KEY)==="1a") demMode="1a"; }catch(e){}
function activeSources(){ return demMode==="1a" ? SOURCES_ALL : SOURCES_ALL.filter(s=>s.name!=="DEM1A"); }

// 中心＋の標高表示(状態は早めに宣言しておく)
const ELEV_STORAGE_KEY="xdler_elev_on";
const ELEV_TIMEOUT_MS=4000, ELEV_CACHE_MAX=30, ELEV_NEG_MAX=5000;
const elevTileCache=new Map();   // "path/z/x/y" → 取得済みタイル(古い順に削除)
const elevNegCache=new Set();    // 範囲外(404)・全域NoDataのタイル。再取得しない
let elevOn=false, elevToken=0, elevTimer=null, elevAbort=null;
const THEO_LEVELS = 15;
const THEO_MAX_GRAY = 96;
const CLIFF_THRESHOLD_M = 3; // 崖・護岸判定閾値(m)。実DEM5A解析で通常斜面(1px差<1m)と崖(1px差5〜15m)の間の空白域(2.4〜4.75m)から設定
const THEO_NODATA_GRAY = 0;
const THEO_LAND_MIN_GRAY = 11; // 水位固定:陸の最低グレー。実機テストで水/陸の境界はグレー10|11と確定済み(陸は必ず11以上)
const WATER_GAP_CLOSE = true; // 細い水路の途切れ補完(v12-15)
// ---- 崖プラグイン出力(v13-1) ----
const CLIFF_LAND_BASE_H = 1;   // 陸の最低ゲーム高さ(PNGの段0→高さ1、段14→高さ15)。水/NoDataは0
const CLIFF_STEPS = 3;         // 隣り合うマスの高さの差がこの段数以上なら崖(壁を置く)
const CLIFF_WALK = 4;          // 崖の両側で、崖から離れる向きに何マス分(崖のマス自身を含む)ゲームの斜面を平らにするか(v13-5)
const CLIFF_MIN_GAME = 5;     // v13-7: ゲーム側の落差(上段-下段)がこの段数未満の崖の辺は何もしない(ゲームのなだらかな斜面のまま)。v13-9で3→5。4にすると崖が増える
const CLIFF_ROUNDS = 1;       // v13-8: 壁を置けない段差/小数のズレの境目の斜面マスを平らにする周回数(増やすと隙間は減るが段々の範囲が広がる)
const CLIFF_SLIVER = 0.25;    // v13-8: 平らにしたマスと隣の斜面マスの高さのズレがこの値以上なら、その斜面マスも平らにする
const WALL_MAX_DROP = 6;       // 壁の絵を用意する最大落差(実機確認済みは1〜6。超える分は6に丸める)
const WALL_W = 32, WALL_H = 96; // 壁の絵のサイズ(96=落差6の壁72px+タイル上半分8px+下余白8px+余裕)
const WALL_PAD = 0;            // 絵の下端からタイル下端(最下頂点)までのpx
const WALL_STEP_PX = 12;       // 落差1段あたりの壁の高さpx
const EARTH_R = 6378137;
const WEBMERC_K = 78271.51696402048; // MapLibre GL JSはタイル512px基準のズーム定義のため、256px基準の値(156543...)の半分

/* ===================== DOM要素参照・状態 ===================== */
const el=id=>document.getElementById(id);
const sideEl=el("side");
const sideLockBtnEl=el("sideLockBtn");
const pngBtnEl=el("pngBtn"), zipBtnEl=el("zipBtn"), showInfoBtnEl=el("showInfoBtn"), cliffBtnEl=el("cliffBtn");
const barEl=el("bar"), pgPctEl=el("pgPct"), pgTimeEl=el("pgTime"), pgDetailEl=el("pgDetail");
const progressViewEl=el("progressView"), reportViewEl=el("reportView");
const warnBoxEl=el("warnBox");
const usedDemLineEl=el("usedDemLine"), mixedLineEl=el("mixedLine"), elevRangeLineEl=el("elevRangeLine");
const outputLineEl=el("outputLine"), mppLineEl=el("mppLine"), validLineEl=el("validLine");
const nodataLineEl=el("nodataLine"), validPctLineEl=el("validPctLine"), blankPctLineEl=el("blankPctLine");
const tileBoxEl=el("tileBox");
const resSizeEl=el("resSize"), mppSpanEl=el("mpp");
const sizeBtnEl=el("sizeBtn"), sizeListEl=el("sizeList");
const magnifierEl=el("magnifier");
const mapWrapEl=el("mapWrap"), mapAreaEl=el("mapArea"), frameEl=el("fixedFrame"), centerMarkEl=el("centerMark");
const mapStyleRowEl=el("mapStyleRow");
const lockControlsEl=el("lockControls"), anchorPinEl=el("anchorPin");
const pendingPinEl=el("pendingPin"), endPinEl=el("endPin");
const previewRectEl=el("previewRect");
const axisCandidateLineEl=el("axisCandidateLine");
const mapCreditEl=el("mapCredit");
const elevBadgeEl=el("elevBadge"), elevBtnEl=el("elevBtn");

let currentSize=128;
let centerLat=35.681236, centerLon=139.767125; // 取得範囲の中心(通常時は地図と同期、確定後は抽出範囲の中心)
let currentLoupeSize = 96;
let frameSizePx = 350;
let lastPNG=null, lastJSON=null, lastHeights=null, lastHeightsN=0; // lastHeights: 崖プラグイン用の高さ表(0=水/NoData, 1〜15=陸)
let lastRun=null;       // 直近の生成結果が対応する範囲 {lat,lon,side,size}
let isRunning=false;    // 二重実行防止

mapWrapEl.addEventListener("contextmenu", e => e.preventDefault());

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function deg2rad(v){return v*Math.PI/180;}
function rad2deg(v){return v*180/Math.PI;}
// 手入力・ズーム同期の双方で同じ値域(100〜100000m)に正規化する
function clampSideValue(v){
  let n=Math.round(+v);
  if(!isFinite(n)) n=1000;
  return clamp(n,100,100000);
}

function zoomForSide(Lm,lat,customSizePx){
  const targetPx = customSizePx || frameSizePx;
  const raw=Math.log2(WEBMERC_K*Math.cos(deg2rad(lat))*targetPx/Math.max(1,Lm));
  // 0〜22のクランプ範囲外だと指定距離と実際の表示が食い違うので知らせる
  if(raw<0 || raw>22) showMapErrorBanner("指定距離が表示可能な範囲外のため、ズームを制限して表示しています");
  return clamp(raw,0,22);
}

function layoutOverlay(){
  const w=mapWrapEl.clientWidth;
  const ctrlHeight = 27;
  if(!w) return;

  const viewSize = Math.max(1, Math.floor(w));
  const margin = 10;
  const frameSize = Math.max(1, viewSize - margin * 2);

  frameSizePx = frameSize;

  if(mapAreaEl){
    mapAreaEl.style.width = viewSize + "px";
    mapAreaEl.style.height = viewSize + "px";
  }

  // 地図スタイルボタン行の幅を、右パネルのdemtagボタン行(1A優先/5Aから)に揃える
  const demTagsEl = document.getElementById("demModeBtns");
  const styleBtnsRowEl = document.getElementById("styleBtns");
  if(demTagsEl && styleBtnsRowEl){
    const demW = demTagsEl.getBoundingClientRect().width;
    if(demW>0) styleBtnsRowEl.style.maxWidth = demW + "px";
  }

  const buttonGap = -2;   // ガイダンスバーとコピーライトの間の余白
  const barTopGap = 1;   // スタイル行下端とガイダンスバーの間の余白
  // mapStyleRow(地図スタイル行)はmapArea直後の通常フローに置いているので、
  // 実際の高さはoffsetTop/offsetHeightから読む(出典表示の折り返し等があっても崩れない)
  const guidanceTop = mapStyleRowEl ? (mapStyleRowEl.offsetTop + mapStyleRowEl.offsetHeight + barTopGap) : viewSize + barTopGap;

  // コピーライト表示はガイダンスバーのさらに下に配置する
  const creditTop = guidanceTop + ctrlHeight + buttonGap;
  if(mapCreditEl){
    mapCreditEl.style.top = creditTop + "px";
  }
  const creditGap = 2, creditHeight = mapCreditEl ? (mapCreditEl.offsetHeight || 10) : 10;
  const needed = creditTop + creditGap + creditHeight;
  mapWrapEl.style.height = needed + "px";

  frameEl.style.width=frameSize+"px";
  frameEl.style.height=frameSize+"px";
  frameEl.style.left=margin+"px";
  frameEl.style.top=margin+"px";

  centerMarkEl.style.left=(viewSize/2)+"px";
  centerMarkEl.style.top=(viewSize/2)+"px";
  elevBadgeEl.style.left=(viewSize/2+12)+"px";
  elevBadgeEl.style.top=(viewSize/2+8)+"px";

  lockControlsEl.style.top=guidanceTop+"px";
  lockControlsEl.style.width="calc(100% - 16px)";
  lockControlsEl.style.left="8px";
}

function frameBoundsInMap(){
  const fr=frameEl.getBoundingClientRect(), mr=map.getContainer().getBoundingClientRect();
  const left=fr.left-mr.left, top=fr.top-mr.top;
  return {left,top,right:left+fr.width,bottom:top+fr.height,width:fr.width,height:fr.height};
}

layoutOverlay();

// resizeとResizeObserverの重複処理を1本化。2辺固定のズーム調整中は、リサイズ後にpadding(=枠の角への中心合わせ)を再計算する
function onLayoutChange(){
  layoutOverlay();
  if(lockStage>=4){
    if(map.loaded()) map.resize();
    if(lockStage===4) updatePreviewRect();
    if(lockStage===5) showCleanView();
  }else if(twoEdge && lockStage===2){
    if(map.loaded()) map.resize();
    map.setPadding(twoEdgePadding());
    updateMapView();
  }else{
    updateMapView();
    if(map.loaded()) map.resize();
  }
}
window.addEventListener("resize",onLayoutChange);
if(typeof ResizeObserver!=="undefined"){
  new ResizeObserver(onLayoutChange).observe(mapWrapEl);
}

// TheoTownの実際のマップサイズ(タイル数)。1タイル=10m固定(2026-09-22実機検証で確定。テスト7+新規マップ「大きさ」選択肢の面積表示から算出)。
// 出力サイズ候補。32〜512はTheoTownの実際のマップサイズ(1タイル=10m固定)。1024はTheoTown側に対応するマップサイズは存在しないが、
// 「あえて広い範囲を高px出力し、TheoTownの自動縮小(取込み時に512へ縮小)に委ねる」ための繰り上げ専用候補(2026-09-22実測:この方が地形の再現度が高い)。
const THEOTOWN_MAP_SIZES = [32, 64, 128, 256, 384, 512, 1024];
function getRecommendedSize(L){
  const idealTiles = L / 10; // 10m/タイル
  const idx = THEOTOWN_MAP_SIZES.findIndex(size => size >= idealTiles);
  if(idx === -1) return THEOTOWN_MAP_SIZES[THEOTOWN_MAP_SIZES.length - 1]; // 1024を超える場合は1024で頭打ち
  const fit = THEOTOWN_MAP_SIZES[idx];
  if(fit === idealTiles) return fit; // ちょうど一致(縮小が発生しない)場合は据置
  // 縮小(切り上げ)が発生する場合、一段階大きい候補があればそちらを推奨する
  // (2026-09-22実測:TheoTown取込み時の自動縮小の方が、ダウンローダー側の点サンプリングより地形の再現度が高いため)
  const bump = THEOTOWN_MAP_SIZES[idx + 1];
  return bump !== undefined ? bump : fit;
}

function updateRecommendedSizeInList(){
  const L = clampSideValue(sideEl.value);
  const rec = getRecommendedSize(L);
  sizeListEl.querySelectorAll(".dropdown-item").forEach(item => {
    const val = +item.dataset.value;
    item.textContent = `${val}×${val}` + (val === rec ? "（推奨）" : "");
  });
}

sizeBtnEl.addEventListener("click",e=>{
  e.stopPropagation();
  updateRecommendedSizeInList();
  sizeListEl.classList.toggle("open");
});

sizeListEl.querySelectorAll(".dropdown-item").forEach(item=>{
  item.addEventListener("click",()=>{
    currentSize=+item.dataset.value;
    sizeBtnEl.textContent=`${currentSize}×${currentSize}`;
    sizeListEl.classList.remove("open");
    updateMapView();
  });
});
document.addEventListener("click",()=>sizeListEl.classList.remove("open"));

if(typeof maplibregl === "undefined"){
  document.getElementById("map").innerHTML='<div style="padding:24px;color:#fff;font-size:14px">地図ライブラリを読み込めませんでした。インターネット接続を確認して再読み込みしてください。</div>';
  throw new Error("MapLibre GL JS could not be loaded");
}
// 地図タイル(画像タイル)。地理院タイルとOSMタイルは出典表示が利用条件。地図上ではなくパネルの出典行に表示する
const TILE_STYLES={
  pale  :{tiles:"https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",   maxzoom:18, credit:"地図・標高データ: 国土地理院"},
  std   :{tiles:"https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",    maxzoom:18, credit:"地図・標高データ: 国土地理院"},
  osm   :{tiles:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",             maxzoom:19, credit:"地図: © OpenStreetMap contributors / 標高データ: 国土地理院"},
  relief:{tiles:"https://cyberjapandata.gsi.go.jp/xyz/relief/{z}/{x}/{y}.png", maxzoom:15, credit:"地図・標高データ: 国土地理院(色別標高図)"}
};
// 旧版(OpenFreeMap対応版)の保存値(liberty等・自動フォールバックで保存されたosm)を引き継がないよう、キーを変えている
const STYLE_STORAGE_KEY="xdler_map_style_v10";
// 本体地図とルーペ用地図でオブジェクトを共有しないよう、毎回新しく作る。maxzoom超は拡大表示(ルーペの高ズームでも途切れない)
function styleFor(key){
  const s=TILE_STYLES[key];
  return {version:8,
    sources:{base:{type:"raster",tiles:[s.tiles],tileSize:256,maxzoom:s.maxzoom}},
    layers:[{id:"base",type:"raster",source:"base"}]};
}
function isValidStyleKey(k){ return Object.prototype.hasOwnProperty.call(TILE_STYLES,k); }
let currentStyleKey="pale";
try{
  const saved=localStorage.getItem(STYLE_STORAGE_KEY);
  if(isValidStyleKey(saved)) currentStyleKey=saved;
}catch(e){}

// 前回終了した地図の位置とズームを復元する(保存が無い・壊れている場合は初期値のまま)
const VIEW_STORAGE_KEY="xdler_last_view_v11";
try{
  const v=JSON.parse(localStorage.getItem(VIEW_STORAGE_KEY)||"null");
  if(v && [v.lat,v.lon,v.zoom].every(n=>typeof n==="number" && isFinite(n)) && Math.abs(v.lat)<=85 && Math.abs(v.lon)<=180 && v.zoom>=0 && v.zoom<=22){
    centerLat=v.lat; centerLon=v.lon;
    // 地図のズームは「1辺の距離」から決まるので、保存したズームに相当する距離を入れる
    sideEl.value=clampSideValue(WEBMERC_K*Math.cos(deg2rad(v.lat))*frameSizePx/Math.pow(2,v.zoom));
  }
}catch(e){}

const map = new maplibregl.Map({
  container:"map",
  style:styleFor(currentStyleKey),
  center:[centerLon,centerLat],
  zoom:zoomForSide(clampSideValue(sideEl.value),centerLat),
  fadeDuration:0,
  preserveDrawingBuffer:true,
  attributionControl:false,
  dragRotate:false,
  pitchWithRotate:false,
  maxPitch:0
});
// 回転すると枠が北状態でなくなり、取得範囲(北上の正方形)とずれるため、タッチ・キーボードの回転も無効化する
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();

let programmaticZoom=false;
let lastMapError="";
let mapErrorBannerEl=null, mapErrorBannerTimer=null;
let mapErrorLastMessage="", mapErrorLastShownAt=0;

function showMapErrorBanner(msg){
  if(!mapErrorBannerEl){
    mapErrorBannerEl=document.createElement("div");
    mapErrorBannerEl.id="mapErrorBanner";
    mapErrorBannerEl.style.cssText="position:absolute;left:0;right:0;top:0;padding:6px 10px;background:#b33;color:#fff;font-size:12px;text-align:center;z-index:30;pointer-events:none;";
    mapAreaEl.appendChild(mapErrorBannerEl);
  }
  const now=Date.now();
  if(msg===mapErrorLastMessage && now-mapErrorLastShownAt<2000) return;
  mapErrorLastMessage=msg; mapErrorLastShownAt=now;
  mapErrorBannerEl.textContent=msg;
  mapErrorBannerEl.style.display="block";
  clearTimeout(mapErrorBannerTimer);
  mapErrorBannerTimer=setTimeout(()=>{ mapErrorBannerEl.style.display="none"; },8000);
}
map.on("error",(e)=>{
  const err=e && e.error;
  const message=err && err.message ? String(err.message) : "不明なエラー";
  const status=err && err.status!=null ? " status="+String(err.status) : "";
  const url=err && err.url ? " url="+String(err.url) : "";
  lastMapError=message+status+url;
  // 404はタイルの無い範囲(地理院タイルの範囲外など)で起こる通常の応答なので、バナーは出さない
  if(!(err && err.status===404)) showMapErrorBanner("地図の読み込みエラー: "+message);
  console.error("MapLibre error:",err);
});

function updateInfoDisplay(){
  const Lm = clampSideValue(sideEl.value), N = currentSize;
  const mpp = Lm / N;
  resSizeEl.textContent = `${N}×${N}`;
  mppSpanEl.textContent = mpp.toFixed(1);
  updateRecommendedSizeInList();
  refreshResultValidity();
}

function updateMapView(){
  updateInfoDisplay();
  if(map.loaded()){
    programmaticZoom=true;
    if(twoEdge && lockStage===2){
      // 2辺固定のズーム調整中: 角(pivot)を動かさず、1辺の距離に合わせたズームだけ変える
      twoEdgeBusy=true;
      map.jumpTo({center:[twoEdge.pivot.lon,twoEdge.pivot.lat], zoom:twoEdgeZoomForSide(clampSideValue(sideEl.value))});
      twoEdgeBusy=false;
    }else{
      const targetZoom=zoomForSide(clampSideValue(sideEl.value), centerLat);
      map.jumpTo({center:[centerLon,centerLat], zoom: targetZoom});
    }
    setTimeout(()=>{ programmaticZoom=false; }, 50);
  }
}

map.on("load",()=>{
  updateMapView();
  layoutOverlay();
  applyLockRestrictions();
  setTimeout(()=>map.resize(),50);
});

sideEl.addEventListener("input",()=>{
  if(!sideLocked) updateMapView();
  else resyncLockedDistanceLive();
});
sideEl.addEventListener("change",()=>{
  if(sideLocked){
    // 距離固定の入力モード中の確定:空欄でなければその値を新しいロック値として採用
    if(sideEl.value!==""){
      sideEl.value=clampSideValue(sideEl.value);
      sidePreLockValue=sideEl.value;
    }
    updateInfoDisplay();
    resyncLockedDistanceLive();
  }else{
    sideEl.value=clampSideValue(sideEl.value);
    updateMapView();
  }
});
sideEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ e.preventDefault(); sideEl.blur(); } // リターンで確定(blur→change発火)
});
sideEl.addEventListener("blur",()=>{
  // 距離固定の入力モード中に空欄のまま確定操作をした場合は、固定開始前の値に戻す(未入力キャンセル)
  if(sideLocked && sideEl.value===""){
    sideEl.value = sidePreLockValue!=null ? sidePreLockValue : clampSideValue("");
    updateInfoDisplay();
  }
});

// 1辺の距離固定（鍵ボタン）制御
// 鍵マークオフ（🔓）: 数値入力不可（readonly）、ズームに連動して数値自動更新
// 鍵マークオン（🔒）: 数値入力可能（readonly解除）、ズームは全面禁止。基点未決定ならスクロール可、決定後はスクロール禁止。
let sideLocked=false;
let sidePreLockValue=null;

function applyLockRestrictions(){
  if(lockStage >= 4){
    disableMapZoom();
    return;
  }
  if(sideLocked){
    // 🔒 オン時：距離が変わるためズーム全面禁止
    map.scrollZoom.disable();
    map.boxZoom.disable();
    map.doubleClickZoom.disable();
    map.touchZoomRotate.disable();

    // スクロール（ドラッグパン）：基点未決定（lockStage===0かつ!lockAnchor）なら許可、基点決定済みなら禁止
    if(lockStage === 0 && !lockAnchor){
      if(!loupeEnabled) map.dragPan.enable();
    }else{
      map.dragPan.disable();
    }
  }else{
    // 🔓 オフ時：通常制御
    if(!twoEdge || lockStage !== 2){
      enableMapZoom();
    }
  }
}

function setSideLocked(on){
  sideLocked = !!on;
  if(sideLocked){
    sidePreLockValue = sideEl.value;
    sideEl.readOnly = false; // 🔒 数値入力可
    sideEl.classList.add("side-locked");
    sideLockBtnEl.classList.add("active");
    sideLockBtnEl.textContent="🔒";
    if(!sideEl.value){
      sideEl.value = clampSideValue("1000");
    }
    sideEl.focus();
    sideEl.select();
  }else{
    sideEl.blur();
    sideEl.readOnly = true; // 🔓 数値入力不可
    sideEl.classList.remove("side-locked");
    sideLockBtnEl.classList.remove("active");
    sideLockBtnEl.textContent="🔓";
    if(sideEl.value===""){
      sideEl.value = sidePreLockValue!=null ? sidePreLockValue : clampSideValue("");
    }else{
      sideEl.value=clampSideValue(sideEl.value);
    }
    sidePreLockValue=null;
    updateMapView();
    setTimeout(()=>{ if(map.loaded()) map.resize(); },350);
  }
  applyLockRestrictions();
}
sideLockBtnEl.addEventListener("click",()=>{ setSideLocked(!sideLocked); });

// 初期状態: 🔓数値入力不可
sideEl.readOnly = true;

// iOS Safari 等、仮想キーボードの開閉でwindowのresizeが発火しない環境向けの保険
if(window.visualViewport){
  window.visualViewport.addEventListener("resize", ()=>{ if(map.loaded()) map.resize(); });
}

function syncCenterFromFrame(){
  const fb = frameBoundsInMap();
  const frameCenterLngLat = map.unproject([fb.left + fb.width / 2, fb.top + fb.height / 2]);
  centerLat = frameCenterLngLat.lat;
  centerLon = frameCenterLngLat.lng;
  refreshResultValidity();
}

// dragend/zoomendで同期責務が分散していたのを一本化し、常にcenter→(必要なら)side→表示更新の順で行う
function syncMapStateFromView(includeSide){
  syncCenterFromFrame();
  if(includeSide){
    const currentZ = map.getZoom();
    const Lm = WEBMERC_K * Math.cos(deg2rad(centerLat)) * frameSizePx / Math.pow(2, currentZ);
    sideEl.value = clampSideValue(Lm);
  }
  updateInfoDisplay();
}

map.on("dragend",()=>{
  if(lockStage>=4) return;
  syncMapStateFromView(false);
});

map.on("zoomend", () => {
  updateAnchorPin(); updatePendingPin(); updateEndPin();
  if (programmaticZoom || lockStage>=4) return;
  if (twoEdge && lockStage===2){ syncTwoEdgeSide(); return; }
  // 自由軸(ns/ew)調整中は「1辺の距離」表示を固定軸のaxisFixedSideのまま維持し、ズームで書き換わらないようにする
  if (lockStage===2 && lockPending && lockPending.axisPending) return;
  // 距離固定(🔒)中はズームでの上書きを止め、この数値を優先して範囲を決める
  if (sideLocked){ syncMapStateFromView(false); return; }
  syncMapStateFromView(true);
});

/* ===================== 固定処理 ===================== */
const LOCK_LONGPRESS_MS=1000, LOCK_MOVE_CANCEL_PX=10, LOCK_CANCEL_MS=3000;

// 固定範囲確定フローの状態は、ここと下のaxisFixed*/lockBounds系に分かれている
let lockMode="";      // "point"|"ns"|"ew"|""(未選択)
let lockStage=0;      // 0:未着手 1:基点確認待ち 2:終点/自由軸待ち 3:確認ボタン待ち 4:範囲確認(stage4) 5:清書表示(stage5)
let lockAnchor=null;  // 基点ピン(表示用。長押しで実際に押した座標)
let lockPending=null; // 確定前の仮ピン(緑)。axisPending:trueの時は自由軸調整中を示す
let lockEnd=null;     // 終点ピン(表示用。長押しで実際に押した座標)
let pointBounds=null; // point方式で確定した抽出範囲(bounds)
let lockPressTimer=null, lockPressStart=null, activePointerId=null;
let isLongPressTriggered = false;
let longPress3Timer=null;
let lockStartState=null;
// 2辺固定(隣り合う2辺を押した場合)の状態。{pivot:{lat,lon}, hEdge:"top"|"bottom", vEdge:"left"|"right", side, prevView}
let twoEdge=null;
let twoEdgeBusy=false;
const ZERO_PADDING={left:0,right:0,top:0,bottom:0};
let axisFreeStartView=null; // 自由軸調整開始時の地図表示位置・ズーム(オフスクリーン長押し時に戻すため)
function saveAxisFreeStartView(){
  axisFreeStartView={center:map.getCenter(), zoom:map.getZoom()};
}

function disableMapZoom() {
  map.scrollZoom.disable();
  map.boxZoom.disable();
  map.doubleClickZoom.disable();
  map.touchZoomRotate.disable();
  map.dragPan.disable();
}

function enableMapZoom() {
  if(sideLocked){
    applyLockRestrictions();
    return;
  }
  map.scrollZoom.enable();
  map.boxZoom.enable();
  // 拡大モード中は、ルーペ側のジェスチャーと競合しないよう地図本体のドラッグ・タッチズームを戻さない
  if(!loupeEnabled){
    map.doubleClickZoom.enable();
    map.touchZoomRotate.enable();
    map.dragPan.enable();
  }
}

// 確定後(stage5)は拡大モードも終了する(地図操作はdisableMapZoomが止める)
function setStage5Controls(disabled){
  if(disabled && loupeEnabled){
    loupeEnabled=false;
    hideLoupe();
  }
}

function setCleanViewOverlays(){
  const isCleanView=lockStage===5;
  const isPreviewOrClean=lockStage===4 || lockStage===5;
  frameEl.style.display=isPreviewOrClean ? "none" : "block";
  centerMarkEl.style.display=isPreviewOrClean ? "none" : "block";
  updateElevBadge();
  if(isCleanView){
    previewRectEl.classList.remove("show");
    anchorPinEl.style.display="none";
    pendingPinEl.style.display="none";
    endPinEl.style.display="none";
  }
}

function resetLock(){
  clearTwoEdgeState();
  lockStage=0; lockAnchor=null; lockPending=null; lockEnd=null; pointBounds=null; lockBounds=null; lockFreeAxisValue=null; lockFreeAxisDirection=1; centerLonValue=0; centerLatValue=0; axisFixedStart=null; axisFixedEnd=null; axisFixedSide=0;
  clearTimeout(lockPressTimer); clearTimeout(longPress3Timer); lockPressStart=null; activePointerId=null;
  isLongPressTriggered = false;
  frameEl.classList.remove("locked");
  previewRectEl.classList.remove("show");
  anchorPinEl.style.display="none";
  pendingPinEl.style.display="none";
  endPinEl.style.display="none";
  frameEl.style.display="block";
  centerMarkEl.style.display="block";
  updateElevBadge();
  setStage5Controls(false);
  unlockAxisFreeZoomLimit();
  hideAxisCandidateLine();
  if(loupeEnabled) setLoupeMode(false);
  if(sideLocked) setSideLocked(false); // 全キャンセル時に距離固定の状態が残らないようにする
  applyLockRestrictions();
}

function restoreLockStartState(){
  const restore=lockStartState;
  resetLock();
  lockMode="";
  if(map.loaded()) map.doubleClickZoom.enable();
  updateLockGuidance();
  applyLockRestrictions();
  if(!restore || !map.loaded()) return;
  currentSize=restore.currentSize;
  sizeBtnEl.textContent=`${currentSize}×${currentSize}`;
  sideEl.value=restore.sideMeters;
  centerLat=restore.center.lat;
  centerLon=restore.center.lng;
  updateInfoDisplay();
  programmaticZoom=true;
  map.jumpTo({center:[centerLon,centerLat],zoom:restore.zoom});
  setTimeout(()=>{ programmaticZoom=false; },50);
}

function clientToLngLat(clientX,clientY){
  const r=map.getContainer().getBoundingClientRect();
  return map.unproject([clientX-r.left, clientY-r.top]);
}

function positionPinAt(pinEl,lat,lon){
  if(lat === undefined || lon === undefined || lat === null || lon === null){
    pinEl.style.display="none";
    return;
  }
  const p=map.project([lon,lat]);
  pinEl.style.left=p.x+"px";
  pinEl.style.top=p.y+"px";
  pinEl.style.display="block";
}

function updateAnchorPin(){
  if(lockStage===5){
    anchorPinEl.style.display="none"; return;
  }
  if(!lockAnchor || (lockStage < 1 && lockStage !== 4)){
    anchorPinEl.style.display="none"; return;
  }
  positionPinAt(anchorPinEl,lockAnchor.lat,lockAnchor.lon);
  if(lockStage===4){
    anchorPinEl.classList.add("highlight");
  }else{
    anchorPinEl.classList.remove("highlight");
  }
}
function updatePendingPin(){
  if(lockStage===5){
    pendingPinEl.style.display="none"; return;
  }
  if(!lockPending || (lockStage !== 1 && lockStage !== 3 && !(lockStage === 2 && (lockPending.axisPending || twoEdge)) && lockStage !== 4)){
    pendingPinEl.style.display="none"; return;
  }
  positionPinAt(pendingPinEl,lockPending.lat,lockPending.lon);
  if(lockStage===4){
    pendingPinEl.classList.add("highlight");
  }else{
    pendingPinEl.classList.remove("highlight");
  }
}
function updateEndPin(){
  if(lockStage===5){
    endPinEl.style.display="none"; return;
  }
  if(!lockEnd || lockStage < 4){
    endPinEl.style.display="none"; return;
  }
  positionPinAt(endPinEl,lockEnd.lat,lockEnd.lon);
  if(lockStage===4){
    endPinEl.classList.add("highlight");
  }else{
    endPinEl.classList.remove("highlight");
  }
}

function pointSquareBounds(anchor,end){
  const latSign=end.lat>=anchor.lat ? 1 : -1;
  const lonSign=end.lon>=anchor.lon ? 1 : -1;
  let side;
  if(sideLocked){
    // 距離固定中は終点の位置(方向)だけを使い、辺の長さはロックされた「1辺の距離」を優先する
    side=clampSideValue(sideEl.value);
  }else{
    const dLat_m=Math.abs(end.lat-anchor.lat)*(Math.PI/180)*EARTH_R;
    const dLon_m=Math.abs(end.lon-anchor.lon)*(Math.PI/180)*EARTH_R*Math.cos(deg2rad(anchor.lat));
    side=Math.max(100,Math.round(Math.max(dLat_m,dLon_m)));
  }
  const latDelta=rad2deg(side/EARTH_R)*latSign;
  const lonDelta=rad2deg(side/(EARTH_R*Math.cos(deg2rad(anchor.lat))))*lonSign;
  return {
    side,
    west:Math.min(anchor.lon,anchor.lon+lonDelta),
    east:Math.max(anchor.lon,anchor.lon+lonDelta),
    south:Math.min(anchor.lat,anchor.lat+latDelta),
    north:Math.max(anchor.lat,anchor.lat+latDelta)
  };
}

function updatePreviewRect(){
  if(lockStage!==4 || !lockAnchor || !lockEnd){
    previewRectEl.classList.remove("show");
    return;
  }
  let west,south,east,north;
  if(lockBounds){
    ({west,south,east,north}=lockBounds);
  }else if(lockMode==="point" && pointBounds){
    ({west,south,east,north}=pointBounds);
  }else{
    west=Math.min(lockAnchor.lon,lockEnd.lon);
    east=Math.max(lockAnchor.lon,lockEnd.lon);
    south=Math.min(lockAnchor.lat,lockEnd.lat);
    north=Math.max(lockAnchor.lat,lockEnd.lat);
  }
  const p1=map.project([west,north]);
  const p2=map.project([east,south]);
  const left=Math.min(p1.x,p2.x), top=Math.min(p1.y,p2.y);
  const width=Math.abs(p2.x-p1.x), height=Math.abs(p2.y-p1.y);
  previewRectEl.style.left=left+"px";
  previewRectEl.style.top=top+"px";
  previewRectEl.style.width=width+"px";
  previewRectEl.style.height=height+"px";
  previewRectEl.classList.add("show");
}

map.on("move",()=>{
  updateAnchorPin(); updatePendingPin(); updateEndPin();
  if(lockStage===4) updatePreviewRect();
  if(loupeActive) renderLoupe();
});

const mapContainerEl=map.getContainer();
const lockConfirmBtnsEl=el("lockConfirmBtns"), lockYesBtnEl=el("lockYesBtn"), lockNoBtnEl=el("lockNoBtn");

let lastTapTime=0;
function updateLockGuidance(){
  // 範囲確定(確認画面・確定後)の間は、取得範囲とずれないよう「1辺の距離」の手入力を止める
  sideEl.readOnly= (lockStage>=4) || (!sideLocked);
  applyLockRestrictions();

  const textEl=el("lockStatusText");
  if(!lockMode){
    textEl.textContent="枠内を1秒長押しで範囲の固定を開始";
    textEl.classList.add("idle");
    lockConfirmBtnsEl.style.display="none";
    lockControlsEl.classList.remove("active-guidance");
    return;
  }
  textEl.classList.remove("idle");
  lockControlsEl.classList.add("active-guidance");
  if(lockStage===0){
    textEl.textContent="基点決定";
    lockConfirmBtnsEl.style.display="none";
  }else if(lockStage===1){
    textEl.textContent="この位置でよろしいですか";
    lockYesBtnEl.textContent="はい"; lockNoBtnEl.textContent="やり直し";
    lockConfirmBtnsEl.style.display="flex";
  }else if(lockStage===2){
    textEl.textContent=(twoEdge ? "ズームで範囲を調整→長押しで決定" : ((lockMode!=="point" && lockPending && lockPending.axisPending) ? (lockMode==="ew" ? "南北方向を決定" : "東西方向を決定") : "終点決定"));
    lockConfirmBtnsEl.style.display="none";
  }else if(lockStage===3){
    textEl.textContent="この位置でよろしいですか";
    lockYesBtnEl.textContent="はい"; lockNoBtnEl.textContent="やり直し";
    lockConfirmBtnsEl.style.display="flex";
  }else if(lockStage===4){
    textEl.textContent="この範囲で確定しますか？";
    lockYesBtnEl.textContent="決定"; lockNoBtnEl.textContent="やり直し";
    lockConfirmBtnsEl.style.display="flex";
  }else if(lockStage===5){
    textEl.textContent="範囲確定";
    lockConfirmBtnsEl.style.display="none";
  }
}

function snapToFrame(ll){
  const p=map.project([ll.lng,ll.lat]);
  const b=frameBoundsInMap();
  const corners = [
    {x:b.left, y:b.top, kind:"corner"},
    {x:b.right, y:b.top, kind:"corner"},
    {x:b.left, y:b.bottom, kind:"corner"},
    {x:b.right, y:b.bottom, kind:"corner"}
  ];

  // 角判定ゾーンは枠一辺の25%
  const cornerZoneHalf = b.width * 0.25;
  let validCorners = [];
  for(const c of corners){
    if(Math.abs(p.x - c.x) <= cornerZoneHalf && Math.abs(p.y - c.y) <= cornerZoneHalf){
      validCorners.push({corner: c, dist: Math.hypot(p.x - c.x, p.y - c.y)});
    }
  }

  if(validCorners.length > 0){
    validCorners.sort((a,b) => a.dist - b.dist);
    const nearestCorner = validCorners[0].corner;
    const llSnapped = map.unproject([nearestCorner.x, nearestCorner.y]);
    return {lat:llSnapped.lat, lon:llSnapped.lng, kind:"corner"};
  }

  const x=clamp(p.x,b.left,b.right), y=clamp(p.y,b.top,b.bottom);
  const candidates=[
    ...corners,
    {x:b.left,y:y,kind:"edge",edge:"left"},{x:b.right,y:y,kind:"edge",edge:"right"},
    {x:x,y:b.top,kind:"edge",edge:"top"},{x:x,y:b.bottom,kind:"edge",edge:"bottom"}
  ];
  candidates.sort((u,v)=>Math.hypot(p.x-u.x,p.y-u.y)-Math.hypot(p.x-v.x,p.y-v.y));
  const q=candidates[0], llSnapped=map.unproject([q.x,q.y]);
  return {lat:llSnapped.lat,lon:llSnapped.lng,kind:q.kind,edge:q.edge};
}

function finalizeLock(){
  if(!lockAnchor) return false;

  if(lockMode==="point"){
    const pointEnd=lockEnd || lockPending;
    if(!pointEnd) return false;
    pointBounds=pointSquareBounds(lockAnchor,pointEnd);
    sideEl.value=pointBounds.side;
    centerLat=(pointBounds.south+pointBounds.north)/2;
    centerLon=(pointBounds.west+pointBounds.east)/2;
    lockBounds={...pointBounds};
    lockEnd={lat:pointEnd.lat,lon:pointEnd.lon,kind:pointEnd.kind||"edge"};
    updateInfoDisplay();
    return true;
  }

  if(!axisFixedStart || !axisFixedEnd || !axisFixedSide || lockFreeAxisValue===null) return false;

  const lat1=axisFixedStart.lat, lon1=axisFixedStart.lon;
  const lat2=axisFixedEnd.lat, lon2=axisFixedEnd.lon;
  const side=sideLocked ? clampSideValue(sideEl.value) : axisFixedSide;

  if(lockMode==="ew"){
    const fixedWest=Math.min(lon1,lon2);
    const fixedEast=Math.max(lon1,lon2);
    const fixedCenterLon=(fixedWest+fixedEast)/2;
    const freeLat=lockFreeAxisValue;
    const latDelta=rad2deg(side/EARTH_R);
    const otherLat=freeLat + (lockFreeAxisDirection||1)*latDelta;

    lockBounds={
      west:fixedWest,
      east:fixedEast,
      south:Math.min(freeLat,otherLat),
      north:Math.max(freeLat,otherLat),
      side
    };
    centerLat=(lockBounds.south+lockBounds.north)/2;
    centerLon=fixedCenterLon;

    // 元の長押し座標をそのまま保持する
    lockAnchor={lat:lat1,lon:lon1,kind:axisFixedStart.kind||"edge",edge:axisFixedStart.edge};
    lockEnd={lat:lat2,lon:lon2,kind:axisFixedEnd.kind||"edge",edge:axisFixedEnd.edge};
  }else if(lockMode==="ns"){
    const fixedSouth=Math.min(lat1,lat2);
    const fixedNorth=Math.max(lat1,lat2);
    const fixedCenterLat=(fixedSouth+fixedNorth)/2;
    const freeLon=lockFreeAxisValue;
    const lonDelta=rad2deg(side/(EARTH_R*Math.cos(deg2rad(lat1))));
    const otherLon=freeLon + (lockFreeAxisDirection||1)*lonDelta;

    lockBounds={
      west:Math.min(freeLon,otherLon),
      east:Math.max(freeLon,otherLon),
      south:fixedSouth,
      north:fixedNorth,
      side
    };
    centerLat=fixedCenterLat;
    centerLon=(lockBounds.west+lockBounds.east)/2;

    // 元の長押し座標をそのまま保持する
    lockAnchor={lat:lat1,lon:lon1,kind:axisFixedStart.kind||"edge",edge:axisFixedStart.edge};
    lockEnd={lat:lat2,lon:lon2,kind:axisFixedEnd.kind||"edge",edge:axisFixedEnd.edge};
  }else{
    return false;
  }

  sideEl.value=side;
  updateInfoDisplay();
  return true;
}

// 距離固定(🔒)中に「1辺の距離」の数値を編集した際、基点(および対角/対辺の方向)を保ったまま
// 枠とズームをその場で再計算する。方向は既存のlockEnd(点固定)/axisFixedEnd(南北・東西固定)に
// 保持されている実座標から決まるため、新しいルールは不要(finalizeLock自体がsideLocked中は
// sideEl.valueを辺の長さとして優先する設計に揃えてある)。
function resyncLockedDistanceLive(){
  if(!sideLocked || !map.loaded()) return;
  if(!lockAnchor){
    // 基点未決定:中心はそのまま、指定距離に合わせてズームだけ変える
    updateMapView();
    return;
  }
  if(!lockEnd && !(axisFixedStart && axisFixedEnd)){
    // 基点はあるが対角/対辺の方向がまだ無い(2点目未決定)ので、数値だけでは再計算できない
    return;
  }
  if(!finalizeLock()) return;
  programmaticZoom=true;
  const targetZoom=zoomForSide(clampSideValue(sideEl.value), centerLat);
  map.jumpTo({center:[centerLon,centerLat], zoom: targetZoom});
  setTimeout(()=>{ programmaticZoom=false; }, 50);
  if(lockStage>=4 && typeof updatePreviewRect==="function") updatePreviewRect();
}

let axisFixedStart=null;    // ns/ew: 固定軸の基点(長押しした実座標)
let axisFixedEnd=null;      // ns/ew: 固定軸の終点(長押しした実座標)
let axisFixedSide=0;        // ns/ew: 固定軸の実距離(m)
let lockFreeAxisValue=null; // ns/ew: 自由軸側の確定値(ew=lat / ns=lon)
let lockFreeAxisDirection=1;// ns/ew: 自由軸のもう一方の端の算出方向
let centerLonValue=0;       // ns/ew: 自由軸調整中の地図中心経度
let centerLatValue=0;       // ns/ew: 自由軸調整中の地図中心緯度
let lockBounds=null;        // ns/ew: 確定した抽出範囲(bounds)
let lockAxisGuardBusy=false;

function finalizeAxisFromFreePress(snapped){
  if(!snapped || !axisFixedStart || !axisFixedEnd) return false;
  if(lockMode==="ew"){
    lockFreeAxisValue=snapped.lat;
    lockFreeAxisDirection=snapped.edge==="top" ? -1 : 1;
    return true;
  }
  if(lockMode==="ns"){
    lockFreeAxisValue=snapped.lon;
    lockFreeAxisDirection=snapped.edge==="right" ? -1 : 1;
    return true;
  }
  return false;
}

function snapFreeAxisToFrame(ll){
  const b=frameBoundsInMap();
  const p=map.project([ll.lng,ll.lat]);
  const x=p.x, y=p.y;
  if(lockMode==="ew"){
    const topDist=Math.abs(y-b.top), bottomDist=Math.abs(y-b.bottom);
    if(Math.min(topDist,bottomDist)>b.height*0.25) return null;
    const isTop=topDist<=bottomDist;
    const ll=map.unproject([clamp(x,b.left,b.right),isTop?b.top:b.bottom]);
    return {lat:ll.lat,lon:ll.lng,kind:"edge",edge:isTop?"top":"bottom"};
  }
  if(lockMode==="ns"){
    const leftDist=Math.abs(x-b.left), rightDist=Math.abs(x-b.right);
    if(Math.min(leftDist,rightDist)>b.width*0.25) return null;
    const isLeft=leftDist<=rightDist;
    const ll=map.unproject([isLeft?b.left:b.right,clamp(y,b.top,b.bottom)]);
    return {lat:ll.lat,lon:ll.lng,kind:"edge",edge:isLeft?"left":"right"};
  }
  return null;
}

function prepareAxisLock(){
  if(!lockAnchor || !lockPending) return false;

  axisFixedStart={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge};
  axisFixedEnd={lat:lockPending.lat,lon:lockPending.lon,kind:lockPending.kind,edge:lockPending.edge};

  if(lockMode==="ew"){
    const dLon_m=Math.abs(axisFixedStart.lon-axisFixedEnd.lon)*(Math.PI/180)*EARTH_R*Math.cos(deg2rad(axisFixedStart.lat));
    axisFixedSide=sideLocked ? clampSideValue(sideEl.value) : Math.max(100,Math.round(dLon_m));
    centerLonValue=(axisFixedStart.lon+axisFixedEnd.lon)/2;
    centerLatValue=map.getCenter().lat;
  }else if(lockMode==="ns"){
    const dLat_m=Math.abs(axisFixedStart.lat-axisFixedEnd.lat)*(Math.PI/180)*EARTH_R;
    axisFixedSide=sideLocked ? clampSideValue(sideEl.value) : Math.max(100,Math.round(dLat_m));
    centerLatValue=(axisFixedStart.lat+axisFixedEnd.lat)/2;
    centerLonValue=map.getCenter().lng;
  }else{
    return false;
  }

  sideEl.value=axisFixedSide;
  updateInfoDisplay();

  lockAxisGuardBusy=true;
  const c=map.getCenter();
  const fixedCenter=[lockMode==="ew"?centerLonValue:c.lng, lockMode==="ew"?c.lat:centerLatValue];
  const zoomRefLat=lockMode==="ew"?axisFixedStart.lat:centerLatValue;
  const targetZoom=zoomForSide(axisFixedSide,zoomRefLat,frameSizePx);
  map.jumpTo({center:fixedCenter,zoom:targetZoom});
  lockAxisGuardBusy=false;

  enableAxisFreeGestures();
  lockAxisFreeZoomLimit();
  return true;
}

function enableAxisFreeGestures(){
  if(sideLocked){
    applyLockRestrictions();
    return;
  }
  map.scrollZoom.enable();
  map.boxZoom.disable();
  map.doubleClickZoom.disable();
  if(!loupeEnabled){
    map.dragPan.enable();
    map.touchZoomRotate.enable();
  }
}

function lockAxisFreeZoomLimit(){
  if(!axisFixedStart || !axisFixedEnd || !axisFixedSide) return;
  const lat=lockMode==="ew" ? axisFixedStart.lat : centerLatValue;
  const z=zoomForSide(axisFixedSide, lat, frameSizePx);
  map.setMinZoom(z);
}
function unlockAxisFreeZoomLimit(){
  map.setMinZoom(0);
}

function bothAxisFixedPinsVisible(){
  if(!axisFixedStart || !axisFixedEnd) return false;
  const r=map.getContainer().getBoundingClientRect();
  const tol=2;
  const inView=(p)=> p.x>=-tol && p.x<=r.width+tol && p.y>=-tol && p.y<=r.height+tol;
  const p1=map.project([axisFixedStart.lon,axisFixedStart.lat]);
  const p2=map.project([axisFixedEnd.lon,axisFixedEnd.lat]);
  return inView(p1) && inView(p2);
}
let axisOffscreenWarningTimer=null;
function showAxisOffscreenWarning(){
  const textEl=el("lockStatusText");
  if(textEl){
    textEl.textContent="基点・終点が画面内に入っていなかったため、表示位置を元に戻しました";
    clearTimeout(axisOffscreenWarningTimer);
    axisOffscreenWarningTimer=setTimeout(()=>{ updateLockGuidance(); },1500);
  }
  if(axisFreeStartView){
    map.jumpTo({center:axisFreeStartView.center, zoom:axisFreeStartView.zoom});
  }
}

function updateAxisCandidateLine(clientX,clientY){
  if(!(lockMode==="ew"||lockMode==="ns")){ hideAxisCandidateLine(); return; }
  const b=frameBoundsInMap();
  const r=map.getContainer().getBoundingClientRect();
  const x=clientX-r.left, y=clientY-r.top;
  if(lockMode==="ew"){
    const topDist=Math.abs(y-b.top), bottomDist=Math.abs(y-b.bottom);
    if(Math.min(topDist,bottomDist)>b.height*0.25){ hideAxisCandidateLine(); return; }
    const edgeY=topDist<=bottomDist?b.top:b.bottom;
    axisCandidateLineEl.style.left=b.left+"px";
    axisCandidateLineEl.style.top=(edgeY-1)+"px";
    axisCandidateLineEl.style.width=b.width+"px";
    axisCandidateLineEl.style.height="3px";
    axisCandidateLineEl.style.display="block";
  }else{
    const leftDist=Math.abs(x-b.left), rightDist=Math.abs(x-b.right);
    if(Math.min(leftDist,rightDist)>b.width*0.25){ hideAxisCandidateLine(); return; }
    const edgeX=leftDist<=rightDist?b.left:b.right;
    axisCandidateLineEl.style.left=(edgeX-1)+"px";
    axisCandidateLineEl.style.top=b.top+"px";
    axisCandidateLineEl.style.width="3px";
    axisCandidateLineEl.style.height=b.height+"px";
    axisCandidateLineEl.style.display="block";
  }
}
function hideAxisCandidateLine(){
  axisCandidateLineEl.style.display="none";
}

function enforceFixedAxisCenter(){
  if(lockAxisGuardBusy || lockStage!==2 || lockMode==="point" || !lockPending || !lockPending.axisPending) return;
  const c=map.getCenter();
  const wanted=lockMode==="ew"?[centerLonValue,c.lat]:[c.lng,centerLatValue];
  const delta=lockMode==="ew" ? Math.abs(c.lng-centerLonValue) : Math.abs(c.lat-centerLatValue);
  if(delta<1e-10) return;
  lockAxisGuardBusy=true;
  map.setCenter(wanted);
  lockAxisGuardBusy=false;
}

map.on("dragend",enforceFixedAxisCenter);
map.on("zoomend",enforceFixedAxisCenter);

/* ===================== 2辺固定(隣り合う2辺を押した場合) ===================== */
function isHEdge(e){ return e==="top" || e==="bottom"; }
function classifyEdgePair(a,b){
  if(!a || !b) return "unknown";
  if(a===b) return "same";
  return isHEdge(a)===isHEdge(b) ? "opposite" : "adjacent";
}
function checkSecondPress(snapped){
  if(lockMode==="point" || !lockAnchor || !snapped) return {ok:true};
  if(lockAnchor.kind==="corner" || snapped.kind==="corner") return {ok:true};
  const rel=classifyEdgePair(lockAnchor.edge,snapped.edge);
  if(rel==="same") return {ok:false,msg:"基点と同じ辺です。別の辺で決定してください"};
  if(rel==="opposite"){
    const nsPair=isHEdge(lockAnchor.edge);
    if(lockMode==="ns" && !nsPair) return {ok:false,msg:"上下の辺、または隣り合う辺で決定してください"};
    if(lockMode==="ew" && nsPair) return {ok:false,msg:"左右の辺、または隣り合う辺で決定してください"};
  }
  return {ok:true};
}
let lockHintTimer=null;
function showLockHint(msg){
  const textEl=el("lockStatusText");
  if(!textEl) return;
  textEl.textContent=msg;
  clearTimeout(lockHintTimer);
  lockHintTimer=setTimeout(()=>{ updateLockGuidance(); },1800);
}

function twoEdgeTargetPx(){
  const b=frameBoundsInMap();
  return {x:twoEdge.vEdge==="right" ? b.right : b.left, y:twoEdge.hEdge==="top" ? b.top : b.bottom};
}
function twoEdgePadding(){
  const c=map.getContainer(), t=twoEdgeTargetPx();
  const px=2*t.x-c.clientWidth, py=2*t.y-c.clientHeight;
  return {left:Math.max(0,px), right:Math.max(0,-px), top:Math.max(0,py), bottom:Math.max(0,-py)};
}
function twoEdgeZoomForSide(L){
  return clamp(Math.log2(WEBMERC_K*Math.cos(deg2rad(twoEdge.pivot.lat))*frameSizePx/Math.max(1,L)),0,22);
}
function twoEdgeSideFromZoom(){
  return WEBMERC_K*Math.cos(deg2rad(twoEdge.pivot.lat))*frameSizePx/Math.pow(2,map.getZoom());
}
function syncTwoEdgeSide(){
  if(!twoEdge) return;
  if(sideLocked){ updateInfoDisplay(); return; }
  twoEdge.side=clampSideValue(twoEdgeSideFromZoom());
  sideEl.value=twoEdge.side;
  updateInfoDisplay();
}

function enterTwoEdgeView(zoom){
  if(!twoEdge) return;
  twoEdgeBusy=true; programmaticZoom=true;
  map.setMaxZoom(twoEdgeZoomForSide(100));
  map.setMinZoom(twoEdgeZoomForSide(100000));
  map.jumpTo({center:[twoEdge.pivot.lon,twoEdge.pivot.lat], zoom, padding:twoEdgePadding()});
  twoEdgeBusy=false;
  setTimeout(()=>{ programmaticZoom=false; },50);
  map.dragPan.disable(); map.boxZoom.disable(); map.doubleClickZoom.disable();
  if(sideLocked){
    map.scrollZoom.disable();
    map.touchZoomRotate.disable();
  }else{
    map.scrollZoom.enable({around:"center"});
    if(!loupeEnabled){
      map.touchZoomRotate.enable({around:"center"});
    }
  }
  syncTwoEdgeSide();
}

function prepareTwoEdgeLock(){
  if(!lockAnchor || !lockPending) return false;
  const a=lockAnchor.edge, b=lockPending.edge;
  if(classifyEdgePair(a,b)!=="adjacent") return false;
  const hPt=isHEdge(a) ? lockAnchor : lockPending;
  const vPt=isHEdge(a) ? lockPending : lockAnchor;
  twoEdge={
    pivot:{lat:hPt.lat, lon:vPt.lon},
    hEdge:isHEdge(a) ? a : b,
    vEdge:isHEdge(a) ? b : a,
    side:0,
    prevView:{center:map.getCenter(), zoom:map.getZoom()}
  };
  enterTwoEdgeView(sideLocked ? twoEdgeZoomForSide(clampSideValue(sideEl.value)) : map.getZoom());
  return true;
}

function leaveTwoEdgeView(restoreView){
  if(!twoEdge) return;
  const prev=twoEdge.prevView;
  twoEdgeBusy=true;
  map.setMinZoom(0); map.setMaxZoom(22);
  map.scrollZoom.enable();
  if(!loupeEnabled){ map.dragPan.enable(); map.touchZoomRotate.enable(); }
  map.boxZoom.disable(); map.doubleClickZoom.disable();
  if(restoreView){
    programmaticZoom=true;
    map.jumpTo({center:prev.center, zoom:prev.zoom, padding:ZERO_PADDING});
    setTimeout(()=>{ programmaticZoom=false; },50);
    twoEdge=null;
  }
  twoEdgeBusy=false;
}

function clearTwoEdgeState(){
  if(!twoEdge) return;
  twoEdge=null;
  map.setMaxZoom(22);
  map.setPadding(ZERO_PADDING);
}

function finalizeTwoEdge(){
  if(!twoEdge || !lockAnchor) return false;
  const side=clampSideValue(sideLocked ? sideEl.value : twoEdgeSideFromZoom());
  const lat=twoEdge.pivot.lat, lon=twoEdge.pivot.lon;
  const latDelta=rad2deg(side/EARTH_R);
  const lonDelta=rad2deg(side/(EARTH_R*Math.cos(deg2rad(lat))));
  const north=twoEdge.hEdge==="top" ? lat : lat+latDelta;
  const south=twoEdge.hEdge==="top" ? lat-latDelta : lat;
  const east=twoEdge.vEdge==="right" ? lon : lon+lonDelta;
  const west=twoEdge.vEdge==="right" ? lon-lonDelta : lon;
  lockBounds={west,east,south,north,side};
  twoEdge.side=side;
  centerLat=(south+north)/2; centerLon=(west+east)/2;
  sideEl.value=side;
  updateInfoDisplay();
  return true;
}

function returnToTwoEdgeStage2(){
  if(!twoEdge || !lockEnd) return;
  lockPending={lat:lockEnd.lat,lon:lockEnd.lon,kind:lockEnd.kind||"edge",edge:lockEnd.edge};
  lockEnd=null; lockBounds=null;
  lockStage=2;
  previewRectEl.classList.remove("show");
  setCleanViewOverlays();
  enterTwoEdgeView(twoEdgeZoomForSide(twoEdge.side||1000));
  updateAnchorPin(); updatePendingPin(); updateEndPin(); updateLockGuidance();
}

map.on("zoom",()=>{
  if(!twoEdge || lockStage!==2 || programmaticZoom || twoEdgeBusy) return;
  syncTwoEdgeSide();
});
map.on("moveend",()=>{
  if(!twoEdge || lockStage!==2 || twoEdgeBusy) return;
  const t=twoEdgeTargetPx(), p=map.project([twoEdge.pivot.lon,twoEdge.pivot.lat]);
  if(Math.abs(p.x-t.x)<0.5 && Math.abs(p.y-t.y)<0.5) return;
  twoEdgeBusy=true;
  map.jumpTo({center:[twoEdge.pivot.lon,twoEdge.pivot.lat]});
  twoEdgeBusy=false;
});

function fitZoomForBounds(bounds,viewSize){
  const mercY=lat=>Math.log(Math.tan(Math.PI/4+deg2rad(lat)/2));
  const wUnit=(bounds.east-bounds.west)/360;
  const hUnit=(mercY(bounds.north)-mercY(bounds.south))/(2*Math.PI);
  const unit=Math.max(wUnit,hUnit);
  if(!(unit>0)) return null;
  return clamp(Math.log2(viewSize/(512*unit)),0,22);
}

function previewLock(){
  const bounds=lockBounds || pointBounds;
  const side=bounds ? bounds.side : +sideEl.value;
  const viewSize=frameSizePx;
  const fitZoom=bounds ? fitZoomForBounds(bounds,viewSize) : null;
  const targetZoom=fitZoom!==null ? fitZoom : zoomForSide(side,centerLat,viewSize);
  disableMapZoom();
  programmaticZoom=true;
  lockYesBtnEl.disabled=true; lockNoBtnEl.disabled=true;
  let completed=false;
  const finishPreview=()=>{
    if(completed)return; completed=true; programmaticZoom=false;
    setCleanViewOverlays(); updateLockGuidance(); updateAnchorPin(); updatePendingPin(); updateEndPin(); updatePreviewRect();
    lockYesBtnEl.disabled=false; lockNoBtnEl.disabled=false;
  };
  map.once("moveend",finishPreview);
  map.easeTo({center:[centerLon,centerLat],zoom:targetZoom,padding:ZERO_PADDING,duration:350});
  setTimeout(finishPreview,400);
}

function showCleanView(){
  const bounds = lockBounds || pointBounds;
  if(!bounds) return;
  const viewSize=mapAreaEl?mapAreaEl.clientWidth:frameSizePx;
  programmaticZoom=true;
  const approxZoom=zoomForSide(bounds.side,centerLat,viewSize);
  map.jumpTo({center:[centerLon,centerLat],zoom:approxZoom});
  const p1=map.project([bounds.west,bounds.north]);
  const p2=map.project([bounds.east,bounds.south]);
  const actualPx=Math.max(Math.abs(p2.x-p1.x),Math.abs(p2.y-p1.y));
  const finalZoom = actualPx>0 ? clamp(approxZoom+Math.log2(viewSize/actualPx),0,22) : approxZoom;
  map.jumpTo({center:[centerLon,centerLat],zoom:finalZoom});
  map.once("moveend",()=>{programmaticZoom=false;});
  setTimeout(()=>{programmaticZoom=false;},50);
}

function stepBackLock(){
  if(!lockMode)return;
  if(lockStage===5) return;
  if(lockStage===1){
    lockPending=null; pendingPinEl.style.display="none"; lockStage=0; updateLockGuidance();
  }else if(lockStage===2){
    if(twoEdge){
      leaveTwoEdgeView(true);
      lockStage=3;
      updateAnchorPin(); updatePendingPin(); updateLockGuidance();
    }else if(lockPending && lockPending.axisPending && axisFixedStart && axisFixedEnd){
      lockPending=Object.assign({}, lockPending, {axisPending:false});
      axisFixedStart=null; axisFixedEnd=null; axisFixedSide=0;
      lockStage=3;
      unlockAxisFreeZoomLimit();
      hideAxisCandidateLine();
      updateAnchorPin(); updatePendingPin(); updateLockGuidance();
    }else{
      lockPending=lockAnchor; lockAnchor=null; anchorPinEl.style.display="none"; lockStage=1; updatePendingPin(); updateLockGuidance();
    }
  }else if(lockStage===3){
    lockPending=null; pendingPinEl.style.display="none"; lockStage=2; updateLockGuidance();
  }else if(lockStage===4){
    if(twoEdge && lockMode!=="point"){
      returnToTwoEdgeStage2();
    }else if(lockMode==="point" || !axisFixedStart){
      resetLock(); lockMode=""; updateLockGuidance();
    }else{
      lockAnchor = {lat: axisFixedStart.lat, lon: axisFixedStart.lon, kind: axisFixedStart.kind||"edge", edge: axisFixedStart.edge};
      lockPending = {lat: axisFixedEnd.lat, lon: axisFixedEnd.lon, kind: axisFixedEnd.kind||"edge", edge: axisFixedEnd.edge, axisPending: true};
      lockEnd = null;
      lockFreeAxisValue = null;
      lockFreeAxisDirection = 1;
      lockBounds = null;
      lockStage = 2;
      previewRectEl.classList.remove("show");
      setCleanViewOverlays();
      enableAxisFreeGestures();
      lockAxisFreeZoomLimit();
      saveAxisFreeStartView();
      updateAnchorPin(); updatePendingPin(); updateEndPin(); updateLockGuidance();
    }
  }
}

function advanceLockAtLngLat(ll){
  isLongPressTriggered=true;

  // 2辺固定のズーム調整中は、長押しで確定
  if(lockStage===2 && twoEdge){
    if(!lockPending || !finalizeTwoEdge()) return;
    lockEnd={lat:lockPending.lat,lon:lockPending.lon,kind:lockPending.kind||"edge",edge:lockPending.edge};
    lockPending=null;
    leaveTwoEdgeView(false);
    lockStage=4;
    updateAnchorPin(); updatePendingPin(); updateEndPin(); updatePreviewRect(); previewLock();
    return;
  }

  // ns/ewの自由軸(2本目の辺)の確定
  if(lockStage===2 && lockMode!=="point" && lockAnchor && lockPending && lockPending.axisPending){
    if(!bothAxisFixedPinsVisible()){ showAxisOffscreenWarning(); return; }
    const freeSnapped=snapFreeAxisToFrame(ll);
    if(!freeSnapped || !finalizeAxisFromFreePress(freeSnapped)) return;
    lockPending=Object.assign({},freeSnapped,{axisPending:false});
    if(!finalizeLock()) return;
    lockStage=4;
    unlockAxisFreeZoomLimit();
    hideAxisCandidateLine();
    updateAnchorPin(); updatePendingPin(); updateEndPin(); updatePreviewRect(); previewLock();
    return;
  }

  const snapped=snapToFrame(ll);

  if(lockStage===0){
    lockPending=snapped; lockStage=1; frameEl.classList.add("locked"); updatePendingPin(); updateLockGuidance(); return;
  }
  if(lockStage===1){
    // 基点確定
    lockAnchor={lat:lockPending.lat,lon:lockPending.lon,kind:lockPending.kind||"edge",edge:lockPending.edge};
    lockPending=null;
    pendingPinEl.style.display="none";
    updateAnchorPin();

    if(sideLocked && (lockMode==="ns" || lockMode==="ew")){
      // 1辺固定(🔒): 東西南北(軸固定)の場合、長さはロック値で一義的に定まるため
      // 2点目の長さ選択をスキップし直接自由軸スライド(対辺方向決定)ステージへ
      axisFixedStart={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge};
      axisFixedEnd={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge};
      axisFixedSide=clampSideValue(sideEl.value);

      centerLatValue=map.getCenter().lat;
      centerLonValue=map.getCenter().lng;

      lockStage=2;
      lockPending={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge,axisPending:true};
      saveAxisFreeStartView();
      updateAnchorPin(); updatePendingPin(); updateLockGuidance(); return;
    }else{
      lockStage=2; updateLockGuidance(); return;
    }
  }
  if(lockStage===2){
    if(sideLocked && lockMode==="point" && lockAnchor){
      // 1辺固定(🔒): 角基点の場合、終点(対角)タップで即座にロック幅の正方形を確定
      lockEnd={lat:snapped.lat,lon:snapped.lon,kind:snapped.kind||"edge"};
      pointBounds=pointSquareBounds(lockAnchor,lockEnd);
      lockBounds={...pointBounds};
      centerLat=(pointBounds.south+pointBounds.north)/2;
      centerLon=(pointBounds.west+pointBounds.east)/2;
      lockStage=4; lockPending=null; updateAnchorPin(); updateEndPin(); updatePreviewRect(); previewLock(); return;
    }
    if(!(lockPending && lockPending.axisPending)){
      const chk=checkSecondPress(snapped);
      if(!chk.ok){ showLockHint(chk.msg); return; }
    }
    lockPending=snapped; lockStage=3; updatePendingPin(); updateLockGuidance(); return;
  }
}

function advanceLockAt(clientX,clientY){
  advanceLockAtLngLat(clientToLngLat(clientX,clientY));
}

function beginAutoLockModeAtLngLat(ll){
  if(lockMode || lockStage!==0)return;
  const b=frameBoundsInMap();
  const p=map.project([ll.lng,ll.lat]);
  if(p.x<b.left || p.x>b.right || p.y<b.top || p.y>b.bottom) return;
  const rx=(p.x-b.left)/Math.max(1,b.width), ry=(p.y-b.top)/Math.max(1,b.height);
  const col=rx<0.25?"left":(rx>0.75?"right":"center");
  const row=ry<0.25?"top":(ry>0.75?"bottom":"center");
  if(col==="center" && row!=="center") lockMode="ns";
  else if(row==="center" && col!=="center") lockMode="ew";
  else lockMode="point";
  lockStartState={center:map.getCenter(),zoom:map.getZoom(),sideMeters:+sideEl.value,currentSize};
  map.doubleClickZoom.disable();
  updateLockGuidance();
}

function beginAutoLockModeAt(clientX,clientY){
  beginAutoLockModeAtLngLat(clientToLngLat(clientX,clientY));
}

mapContainerEl.addEventListener("pointerdown",e=>{

  if(lockStage!==0 && !lockMode)return;
  activePointerId=e.pointerId; isLongPressTriggered=false; lockPressStart={x:e.clientX,y:e.clientY};
  clearTimeout(lockPressTimer); clearTimeout(longPress3Timer);
  if(lockStage!==5){
    lockPressTimer=setTimeout(()=>{
      if(!lockPressStart)return;
      if(!lockMode && lockStage===0) beginAutoLockModeAt(lockPressStart.x,lockPressStart.y);
      if(lockMode) advanceLockAt(lockPressStart.x,lockPressStart.y);
    },LOCK_LONGPRESS_MS);
  }
  // 3秒間継続長押しで全キャンセル
  longPress3Timer=setTimeout(()=>{ restoreLockStartState(); },LOCK_CANCEL_MS);
});

mapContainerEl.addEventListener("pointermove",e=>{
  if(loupeEnabled) return;
  if(e.pointerId!==activePointerId)return;

    updateAxisCandidateLine(e.clientX,e.clientY);
  }
  if(!lockPressStart)return;
  const dist=Math.hypot(e.clientX-lockPressStart.x,e.clientY-lockPressStart.y);
  if(dist>LOCK_MOVE_CANCEL_PX){
    clearTimeout(lockPressTimer);
    clearTimeout(longPress3Timer);
    lockPressStart=null;
  }
});

mapContainerEl.addEventListener("pointerup",e=>{
  if(loupeEnabled) return;
  if(e.pointerId!==activePointerId)return;

  lockPressStart=null;
  activePointerId=null;
  hideAxisCandidateLine();
  if(lockStage===5){
    isLongPressTriggered=false;
    lastTapTime=0;
    return;
  }
  const now=Date.now(), dt=now-lastTapTime;
  if(isLongPressTriggered){isLongPressTriggered=false;lastTapTime=0;return;}
  if(dt<300&&dt>0){stepBackLock();lastTapTime=0;}else lastTapTime=now;
});
mapContainerEl.addEventListener("pointercancel",e=>{
  if(loupeEnabled) return;
  if(e.pointerId!==activePointerId && activePointerId!==null) return;

  lockPressStart=null;
  activePointerId=null;
  isLongPressTriggered=false;
  hideAxisCandidateLine();
});

lockYesBtnEl.addEventListener("click",()=>{

    if(sideLocked && (lockMode==="ns" || lockMode==="ew")){

      // 2点目の長さ選択をスキップし直接自由軸スライド(対辺方向決定)ステージへ
      axisFixedStart={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge};
      axisFixedEnd={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge};
      axisFixedSide=clampSideValue(sideEl.value);

      centerLatValue=map.getCenter().lat;
      centerLonValue=map.getCenter().lng;

      lockStage=2;
      lockPending={lat:lockAnchor.lat,lon:lockAnchor.lon,kind:lockAnchor.kind,edge:lockAnchor.edge,axisPending:true};
      saveAxisFreeStartView();
      updateAnchorPin(); updatePendingPin(); updateLockGuidance();
    }else{
      lockStage=2; updateLockGuidance();

      lockStage=4; lockPending=null; updateAnchorPin(); updateEndPin(); updatePreviewRect(); previewLock();

        if(prepareTwoEdgeLock()){
          lockStage=2;
          updateAnchorPin(); updatePendingPin(); updateLockGuidance();
        }
      }else if(prepareAxisLock()){
        lockStage=2; lockPending={...lockPending,axisPending:true};
        saveAxisFreeStartView();
        updateAnchorPin(); updatePendingPin(); updateLockGuidance();
      }
    }
  }else if(lockStage===4){
    lockStage=5; disableMapZoom(); setStage5Controls(true);
    setCleanViewOverlays();
    showCleanView();
    updateLockGuidance();
  }
});

/* ===================== 拡大鏡 ===================== */
let loupeEnabled=false, loupeActive=false, loupeZoom=2, loupePoint=null, mapDragging=false;
const LOUPE_PAN_SCALE=0.35;
const LOUPE_PINCH_SWITCH_RATIO=0.2, LOUPE_DRAG_START_PX=10;
let loupeViewOff={x:0,y:0};
let loupeDragPoint=null;
let loupeMap=null, loupeMapEl=null, loupeOverlayCanvasEl=null, loupeOverlayCtx=null;
let loupeSizeSynced=-1, loupeNeedsResize=false;
let loupePressTimer=null;
let lastLoupeTapTime=0;
let loupePressStart=null;
let magPressTimer=null, magPressStart=null, lastMagTapTime=0;

function ensureLoupeMap(){
  if(loupeMap) return;
  loupeMapEl=el("loupeMapEl");
  loupeOverlayCanvasEl=el("loupeOverlayCanvas");
  loupeOverlayCtx=loupeOverlayCanvasEl.getContext("2d");
  loupeMap=new maplibregl.Map({
    container:loupeMapEl,
    style:styleFor(currentStyleKey),
    center:[centerLon,centerLat],
    zoom:clamp(map.getZoom()+loupeZoom,0,22),
    fadeDuration:0,
    interactive:false,
    attributionControl:false,
    dragRotate:false,
    pitchWithRotate:false
  });
  loupeMap.on("move",()=>{ if(loupeActive) renderLoupeOverlay(); });
}

function isBoundaryInLoupe(){
  ensureLoupeMap();
  if(!loupeActive || !loupePoint || !loupeMap) return false;
  const size=currentLoupeSize;
  const rects=[];
  if(frameEl.style.display !== "none"){
    const fb=frameBoundsInMap();
    const p1=loupeMap.project(map.unproject([fb.left,fb.top]));
    const p2=loupeMap.project(map.unproject([fb.right,fb.bottom]));
    rects.push({left:Math.min(p1.x,p2.x),right:Math.max(p1.x,p2.x),top:Math.min(p1.y,p2.y),bottom:Math.max(p1.y,p2.y)});
  }
  if(previewRectEl.classList.contains("show")){
    const prL=parseFloat(previewRectEl.style.left);
    const prT=parseFloat(previewRectEl.style.top);
    const prW=parseFloat(previewRectEl.style.width);
    const prH=parseFloat(previewRectEl.style.height);
    if(!isNaN(prL) && !isNaN(prT) && !isNaN(prW) && !isNaN(prH)){
      const p1=loupeMap.project(map.unproject([prL,prT]));
      const p2=loupeMap.project(map.unproject([prL+prW,prT+prH]));
      rects.push({left:Math.min(p1.x,p2.x),right:Math.max(p1.x,p2.x),top:Math.min(p1.y,p2.y),bottom:Math.max(p1.y,p2.y)});
    }
  }
  return rects.some(r => r.left<=size && r.right>=0 && r.top<=size && r.bottom>=0);
}

function showLoupe(point){
  const wasShown = magnifierEl.classList.contains("show");
  loupeActive=true;
  loupePoint={x:point.x,y:point.y};
  loupeViewOff={x:0,y:0};
  const b=frameBoundsInMap();

  currentLoupeSize = b.width * 0.7;

  const frameCenterX = b.left + b.width / 2;
  const frameCenterY = b.top + b.height / 2;

  const isLeft = point.x <= frameCenterX;
  const isTop = point.y <= frameCenterY;

  const targetIsLeft = !isLeft;
  const targetIsTop = isTop;

  let lx, ly;
  const margin = 10;

  if (targetIsTop) ly = b.top + margin;
  else ly = b.top + b.height - margin - currentLoupeSize;

  if (targetIsLeft) lx = b.left + margin;
  else lx = b.left + b.width - margin - currentLoupeSize;

  magnifierEl.style.width = currentLoupeSize + "px";
  magnifierEl.style.height = currentLoupeSize + "px";
  magnifierEl.style.left = lx + "px";
  magnifierEl.style.top = ly + "px";
  magnifierEl.classList.add("show");

  ensureLoupeMap();
  if(!wasShown) loupeNeedsResize=true;
  renderLoupe();
}

function hideLoupe(){
  loupeActive=false;
  magnifierEl.classList.remove("show");
}

function setLoupeMode(on){
  loupeEnabled=on;
  const twoEdgeZoom=!!(twoEdge && lockStage===2);
  if(on){
    map.dragPan.disable();
    map.touchZoomRotate.disable();
    map.getCanvas().style.touchAction="none";
    map.doubleClickZoom.disable();
    clearTimeout(lockPressTimer); clearTimeout(longPress3Timer);
  }else{
    if(lockStage<4){
      if(!twoEdgeZoom && !sideLocked) map.dragPan.enable();
      map.touchZoomRotate.enable(twoEdgeZoom ? {around:"center"} : undefined);
      if(!lockMode) map.doubleClickZoom.enable();
    }
    map.getCanvas().style.touchAction="";
    hideLoupe();
  }
}

function renderLoupe(){
  ensureLoupeMap();
  if(!loupeActive||!loupePoint||!loupeMap)return;
  const dpr=window.devicePixelRatio||1;
  if(loupeNeedsResize || loupeSizeSynced!==currentLoupeSize){
    loupeOverlayCanvasEl.width=Math.round(currentLoupeSize*dpr);
    loupeOverlayCanvasEl.height=Math.round(currentLoupeSize*dpr);
    loupeMap.resize();
    loupeSizeSynced=currentLoupeSize;
    loupeNeedsResize=false;
  }
  const lngLat=map.unproject([loupePoint.x-loupeViewOff.x,loupePoint.y-loupeViewOff.y]);
  const targetZoom=clamp(map.getZoom()+loupeZoom,0,22);
  loupeMap.jumpTo({center:lngLat, zoom:targetZoom});
  renderLoupeOverlay();
}

function renderLoupeOverlay(){
  if(!loupeActive||!loupeMap||!loupeOverlayCtx) return;
  const dpr=window.devicePixelRatio||1;
  const ctx=loupeOverlayCtx;
  ctx.clearRect(0,0,loupeOverlayCanvasEl.width,loupeOverlayCanvasEl.height);

  if(frameEl.style.display !== "none"){
    const fb=frameBoundsInMap();
    const p1=loupeMap.project(map.unproject([fb.left,fb.top]));
    const p2=loupeMap.project(map.unproject([fb.right,fb.bottom]));
    const rx=Math.min(p1.x,p2.x)*dpr, ry=Math.min(p1.y,p2.y)*dpr;
    const rw=Math.abs(p2.x-p1.x)*dpr, rh=Math.abs(p2.y-p1.y)*dpr;
    ctx.save();
    ctx.strokeStyle="#e04b4b";
    ctx.lineWidth=2*dpr;
    if(!frameEl.classList.contains("locked")){
      ctx.setLineDash([6*dpr,4*dpr]);
    }
    ctx.strokeRect(rx,ry,rw,rh);
    ctx.restore();
  }

  if(previewRectEl.classList.contains("show")){
    const prLeft=parseFloat(previewRectEl.style.left);
    const prTop=parseFloat(previewRectEl.style.top);
    const prWidth=parseFloat(previewRectEl.style.width);
    const prHeight=parseFloat(previewRectEl.style.height);
    if(!isNaN(prLeft) && !isNaN(prTop) && !isNaN(prWidth) && !isNaN(prHeight)){
      const p1=loupeMap.project(map.unproject([prLeft,prTop]));
      const p2=loupeMap.project(map.unproject([prLeft+prWidth,prTop+prHeight]));
      const rx=Math.min(p1.x,p2.x)*dpr, ry=Math.min(p1.y,p2.y)*dpr;
      const rw=Math.abs(p2.x-p1.x)*dpr, rh=Math.abs(p2.y-p1.y)*dpr;
      ctx.save();
      ctx.fillStyle="rgba(40,167,69,0.25)";
      ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle="rgba(40,167,69,0.8)";
      ctx.lineWidth=2*dpr;
      ctx.strokeRect(rx,ry,rw,rh);
      ctx.restore();
    }
  }
}

const mapCanvasEl=map.getCanvas();

let touchGestureMode="";
let touchStartTime=0;
let touchStartPoints=[];
let touchTwoFingerStartDistance=0;
let touchTwoFingerStartCenter=null;
let touchLoupeTwoFingerMode="";
let touchLoupeLastCenter=null;
let touchLoupeLastDistance=null;
let touchLoupeDragLastLocal=null;

function getTouchPoint(t,r){
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function getTouchCenter(touches){
  return {
    x:(touches[0].clientX+touches[1].clientX)/2,
    y:(touches[0].clientY+touches[1].clientY)/2
  };
}
function getTouchDistance(touches){
  return Math.hypot(
    touches[0].clientX-touches[1].clientX,
    touches[0].clientY-touches[1].clientY
  );
}
function pointInMagnifier(clientX,clientY){
  if(!loupeActive)return false;
  const r=magnifierEl.getBoundingClientRect();
  return clientX>=r.left && clientX<=r.right && clientY>=r.top && clientY<=r.bottom;
}
function allTouchesOutsideMagnifier(touches){
  if(touches.length!==2)return false;
  return !pointInMagnifier(touches[0].clientX,touches[0].clientY) && !pointInMagnifier(touches[1].clientX,touches[1].clientY);
}
function cancelLoupePressTimers(){
  clearTimeout(loupePressTimer);
  clearTimeout(magPressTimer);
  loupePressStart=null;
  magPressStart=null;
}
function finishTouchGesture(){
  clearTimeout(loupePressTimer);
  clearTimeout(magPressTimer);
  loupePressStart=null;
  magPressStart=null;
  touchGestureMode="";
  touchStartTime=0;
  touchStartPoints=[];
  touchTwoFingerStartDistance=0;
  touchTwoFingerStartCenter=null;
  touchLoupeTwoFingerMode="";
  touchLoupeLastCenter=null;
  touchLoupeLastDistance=null;
  touchLoupeDragLastLocal=null;
}

mapCanvasEl.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch") return;
  if(!loupeEnabled || lockStage===5) return;
  e.preventDefault();
  mapCanvasEl.setPointerCapture(e.pointerId);
  const r=mapCanvasEl.getBoundingClientRect();
  const p={x:e.clientX-r.left,y:e.clientY-r.top};

  const now=Date.now(), dt=now-lastLoupeTapTime;
  if(dt<300 && dt>0){
    lastLoupeTapTime=0;
    if(loupeActive){
      hideLoupe();
    }else{
      setLoupeMode(false);
    }
    return;
  }
  lastLoupeTapTime=now;

  loupeDragPoint=p;
  mapDragging=true;
  showLoupe(p);

  clearTimeout(loupePressTimer);
  loupePressStart={x:e.clientX,y:e.clientY};
  if(isBoundaryInLoupe()){
    loupePressTimer=setTimeout(()=>{
      if(!loupePressStart)return;
      if(!lockMode && lockStage===0) beginAutoLockModeAt(loupePressStart.x,loupePressStart.y);
      if(lockMode) advanceLockAt(loupePressStart.x,loupePressStart.y);
    },LOCK_LONGPRESS_MS);
  }
});

function panLoupeTo(cur){
  const dx=(cur.x-loupeDragPoint.x)*LOUPE_PAN_SCALE;
  const dy=(cur.y-loupeDragPoint.y)*LOUPE_PAN_SCALE;
  if((dx||dy) && !(twoEdge && lockStage===2) && lockStage<4 && !sideLocked) map.panBy([-dx,-dy],{duration:0});
  loupeDragPoint=cur;
  showLoupe(cur);
}

mapCanvasEl.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch") return;
  if(!loupeEnabled||!mapDragging||!loupeDragPoint) return;
  if(loupePressStart){
    const dist=Math.hypot(e.clientX-loupePressStart.x,e.clientY-loupePressStart.y);
    if(dist>LOCK_MOVE_CANCEL_PX){
      clearTimeout(loupePressTimer);
      loupePressStart=null;
    }
  }
  const r=mapCanvasEl.getBoundingClientRect();
  panLoupeTo({x:e.clientX-r.left,y:e.clientY-r.top});
});

function endLoupeDrag(){
  if(!loupeEnabled) return;
  mapDragging=false;
  loupeDragPoint=null;
  clearTimeout(loupePressTimer);
  loupePressStart=null;
  if(lockStage<4) syncCenterFromFrame();
}

let magFineMoved=false;
function loupeFinePan(dx,dy){
  if(!dx && !dy) return;
  if((twoEdge && lockStage===2) || lockStage>=4 || sideLocked) return;
  const s=1/Math.pow(2,loupeZoom);
  map.panBy([-dx*s,-dy*s],{duration:0});
  magFineMoved=true;
}
function endLoupeFinePan(){
  if(!magFineMoved) return;
  magFineMoved=false;
  if(lockStage<4) syncCenterFromFrame();
}

function loupeLocalToLngLat(e){
  ensureLoupeMap();
  const r=magnifierEl.getBoundingClientRect();
  // TouchEventにはclientX/clientYが無く、touches/changedTouchesの中に入っているため吸収する
  const pt = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
  return loupeMap.unproject([pt.clientX-r.left,pt.clientY-r.top]);
}

let magDragLastLocal=null;

magnifierEl.addEventListener("pointerdown",e=>{
  if(e.pointerType==="touch") return;
  if(!loupeEnabled || !loupeActive || !loupeMap || lockStage===5) return;
  e.preventDefault();
  magnifierEl.setPointerCapture(e.pointerId);

  const now=Date.now(), dt=now-lastMagTapTime;
  if(dt<300 && dt>0){
    lastMagTapTime=0;
    hideLoupe();
    return;
  }
  lastMagTapTime=now;

  const ll=loupeLocalToLngLat(e);
  clearTimeout(magPressTimer);
  magPressStart={x:e.clientX,y:e.clientY};
  magDragLastLocal=null;
  if(isBoundaryInLoupe()){
    magPressTimer=setTimeout(()=>{
      if(!magPressStart)return;
      if(!lockMode && lockStage===0) beginAutoLockModeAtLngLat(ll);
      if(lockMode) advanceLockAtLngLat(ll);
    },LOCK_LONGPRESS_MS);
  }
});
magnifierEl.addEventListener("pointermove",e=>{
  if(e.pointerType==="touch") return;
  if(!magPressStart)return;
  const dist=Math.hypot(e.clientX-magPressStart.x,e.clientY-magPressStart.y);
  if(dist>LOCK_MOVE_CANCEL_PX){
    clearTimeout(magPressTimer);
    magPressStart=null;
  }
  const r=magnifierEl.getBoundingClientRect();
  const cur={x:e.clientX-r.left,y:e.clientY-r.top};
  if(magDragLastLocal) loupeFinePan(cur.x-magDragLastLocal.x,cur.y-magDragLastLocal.y);
  magDragLastLocal=cur;
});
magnifierEl.addEventListener("pointerup",e=>{
  if(e.pointerType==="touch") return;
  clearTimeout(magPressTimer);
  magPressStart=null;
  magDragLastLocal=null;
  endLoupeFinePan();
});
magnifierEl.addEventListener("pointercancel",e=>{
  if(e.pointerType==="touch") return;
  clearTimeout(magPressTimer);
  magPressStart=null;
  magDragLastLocal=null;
  endLoupeFinePan();
});

mapCanvasEl.addEventListener("pointerup",e=>{
  if(e.pointerType==="touch") return;
  endLoupeDrag();
});
mapCanvasEl.addEventListener("pointercancel",e=>{
  if(e.pointerType==="touch") return;
  endLoupeDrag();
});

function handleMapTouchStart(e){
  if(lockStage===5 || e.touches.length!==2) return;
  if(!allTouchesOutsideMagnifier(e.touches)) return;
  e.preventDefault();
  clearTimeout(loupePressTimer);
  loupePressStart=null;
  mapDragging=false;
  loupeDragPoint=null;
  touchGestureMode="map2tap";
  touchStartTime=Date.now();
  touchStartPoints=[
    {x:e.touches[0].clientX,y:e.touches[0].clientY},
    {x:e.touches[1].clientX,y:e.touches[1].clientY}
  ];
}

function handleMapTouchStartOne(e){
  if(!loupeEnabled || lockStage===5 || e.touches.length!==1) return;
  if(pointInMagnifier(e.touches[0].clientX,e.touches[0].clientY)) return;
  e.preventDefault();
  const t=e.touches[0];

/* ===================== 中心＋の標高表示 ===================== */
async function fetchElevTile(src,x,y,signal){
  const key=`${src.path}/${src.z}/${x}/${y}`;
  if(elevNegCache.has(key)) return null;
  const hit=elevTileCache.get(key);
  if(hit){ elevTileCache.delete(key); elevTileCache.set(key,hit); return hit; }
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),ELEV_TIMEOUT_MS);
  const onAbort=()=>ctl.abort();
  signal.addEventListener("abort",onAbort);
  try{
    const u=tileURL(src,x,y);
    const r=await fetch(u,{cache:"force-cache",signal:ctl.signal});
    if(r.status===404){ if(elevNegCache.size>=ELEV_NEG_MAX) elevNegCache.clear(); elevNegCache.add(key); return null; }
    if(!r.ok) return undefined;
    const blob=await r.blob();
    if(!blob.type.includes("png")) return undefined;
    const bmp=await createImageBitmap(blob);
    let res;
    try{ res=decodeDemBitmap(bmp,u); }finally{ bmp.close(); }
    if(res.kind!=="ok"){ if(elevNegCache.size>=ELEV_NEG_MAX) elevNegCache.clear(); elevNegCache.add(key); return null; }
    elevTileCache.set(key,res);
    while(elevTileCache.size>ELEV_CACHE_MAX) elevTileCache.delete(elevTileCache.keys().next().value);
    return res;
  }catch(e){
    return undefined;
  }finally{
    clearTimeout(timer);
    signal.removeEventListener("abort",onAbort);
  }
}

function elevPixelAt(res,src,latv,lonv){
  const n=2**src.z;
  const gx=(lonv+180)/360*n*256;
  const gy=(1-Math.asinh(Math.tan(deg2rad(latv)))/Math.PI)/2*n*256;
  const t=xyz(lonv,latv,src.z);
  const lx=clamp(Math.floor(gx)-t.x*256,0,255), ly=clamp(Math.floor(gy)-t.y*256,0,255);
  const i=ly*256+lx;
  return res.mask[i] ? res.elev[i] : NaN;
}

async function lookupElevation(latv,lonv,signal){
  const SOURCES=activeSources();
  const got=await Promise.all(SOURCES.map(async src=>{
    const t=xyz(lonv,latv,src.z);
    return {src,tile:await fetchElevTile(src,t.x,t.y,signal)};
  }));
  if(signal.aborted) return {aborted:true};
  let failedAbove=false;
  for(const {src,tile} of got){
    if(tile===undefined){ failedAbove=true; continue; }
    if(!tile) continue;
    const v=elevPixelAt(tile,src,latv,lonv);
    if(Number.isFinite(v)) return {ok:true,value:v,name:src.name.replace("DEM",""),provisional:failedAbove};
  }
  return failedAbove ? {fail:true} : {nodata:true};
}
